<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সনদ আবেদন কেন্দ্র</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Bengali","SolaimanLipi","Vrinda",Arial,sans-serif;
    background:#f3f6f9;
    color:#222;
}

header{
    background:linear-gradient(135deg,#00695c,#00897b);
    color:#fff;
    padding:22px 15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
    font-size:15px;
}

.container{
    max-width:1250px;
    margin:20px auto;
    padding:0 15px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin:0 0 8px;
    font-size:15px;
}

.number{
    font-size:28px;
    font-weight:bold;
    color:#00796b;
}

.panel{
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.panel h2{
    margin-top:0;
    color:#00695c;
    border-bottom:2px solid #e0f2f1;
    padding-bottom:10px;
}

.tracking-box{
    display:flex;
    justify-content:flex-start;
    margin-bottom:18px;
}

.tracking{
    background:#e8f5e9;
    border:1px solid #80cbc4;
    border-radius:8px;
    padding:10px 15px;
    min-width:280px;
}

.tracking-label{
    font-size:12px;
    color:#555;
    margin-bottom:3px;
}

.tracking-number{
    font-size:18px;
    font-weight:bold;
    color:#00695c;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #cfd8dc;
    border-radius:7px;
    font-size:14px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00897b;
    box-shadow:0 0 0 2px rgba(0,137,123,.1);
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    border:0;
    padding:10px 16px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.btn-primary{
    background:#00796b;
    color:#fff;
}

.btn-primary:hover{
    background:#005f56;
}

.btn-success{
    background:#2e7d32;
    color:#fff;
}

.btn-danger{
    background:#c62828;
    color:#fff;
}

.btn-warning{
    background:#ef6c00;
    color:#fff;
}

.btn-info{
    background:#1565c0;
    color:#fff;
}

.btn-secondary{
    background:#607d8b;
    color:#fff;
}

.button-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
}

.dynamic-box{
    border:1px solid #d8e2e5;
    border-radius:9px;
    padding:15px;
    margin-top:15px;
    background:#fafdfd;
}

.dynamic-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    flex-wrap:wrap;
}

.dynamic-header h3{
    margin:0;
    color:#00695c;
    font-size:17px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,
td{
    border:1px solid #d8dee2;
    padding:7px;
    text-align:center;
    vertical-align:middle;
    font-size:13px;
}

th{
    background:#e0f2f1;
    color:#004d40;
}

td input{
    min-width:110px;
    padding:8px;
}

.serial{
    width:55px;
    font-weight:bold;
}

.search-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:10px;
    margin-bottom:15px;
}

.application-card{
    border:1px solid #ddd;
    border-radius:9px;
    padding:14px;
    margin-bottom:10px;
    background:#fff;
}

.application-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.application-number{
    font-size:17px;
    font-weight:bold;
    color:#00695c;
}

.status{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-pending{
    background:#fff3cd;
    color:#856404;
}

.status-verifying{
    background:#d1ecf1;
    color:#0c5460;
}

.status-approved{
    background:#d4edda;
    color:#155724;
}

.status-cancelled{
    background:#f8d7da;
    color:#721c24;
}

.application-actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.empty{
    padding:25px;
    text-align:center;
    color:#777;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    overflow:auto;
    padding:25px;
}

.modal-content{
    max-width:1100px;
    margin:0 auto;
    background:#fff;
    border-radius:12px;
    padding:22px;
    position:relative;
}

.close{
    position:absolute;
    right:18px;
    top:12px;
    font-size:28px;
    cursor:pointer;
    color:#555;
}

.detail-table{
    width:100%;
    min-width:0;
    margin-bottom:18px;
}

.detail-table td{
    text-align:left;
}

.detail-table td:first-child{
    width:230px;
    font-weight:bold;
    background:#f5f7f8;
}

.watermark{
    position:fixed;
    bottom:7px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(0,105,92,.35);
    font-size:11px;
    pointer-events:none;
    z-index:999;
}

/* PRINT AREA */
#printArea{
    display:none;
}

@media print{

    body *{
        visibility:hidden!important;
    }

    #printArea,
    #printArea *{
        visibility:visible!important;
    }

    #printArea{
        display:block!important;
        position:absolute;
        left:0;
        top:0;
        width:100%;
        background:#fff;
    }

    @page{
        size:A4;
        margin:15mm;
    }

    .print-page{
        width:100%;
        min-height:260mm;
        position:relative;
        color:#000;
    }

    .print-header{
        text-align:center;
        border-bottom:2px solid #000;
        padding-bottom:10px;
        margin-bottom:15px;
    }

    .print-header h1{
        margin:0 0 5px;
        font-size:22px;
    }

    .print-header p{
        margin:3px 0;
        font-size:13px;
    }

    .print-top{
        display:flex;
        justify-content:space-between;
        align-items:flex-start;
    }

    .print-tracking{
        text-align:left;
        font-size:12px;
        line-height:1.8;
    }

    .print-title{
        text-align:center;
        font-size:20px;
        font-weight:bold;
        text-decoration:underline;
        margin:15px 0;
    }

    .print-info{
        width:100%;
        border-collapse:collapse;
        margin:10px 0;
    }

    .print-info td,
    .print-info th{
        border:1px solid #333;
        padding:6px;
        font-size:12px;
    }

    .print-info td:first-child{
        width:190px;
        font-weight:bold;
    }

    .certificate-table{
        width:100%;
        border-collapse:collapse;
        margin-top:10px;
    }

    .certificate-table th,
    .certificate-table td{
        border:1px solid #222;
        padding:5px;
        font-size:10px;
    }

    .certificate-table th{
        background:#eee;
    }

    .signature-area{
        display:flex;
        justify-content:space-between;
        margin-top:65px;
    }

    .signature{
        width:220px;
        text-align:center;
        border-top:1px solid #000;
        padding-top:5px;
        font-size:12px;
    }

    .qr-box{
        text-align:right;
    }

    .qr-box img{
        width:90px;
        height:90px;
    }

    .print-watermark{
        position:fixed;
        bottom:5px;
        left:0;
        right:0;
        text-align:center;
        color:#aaa;
        font-size:9px;
    }
}

@media(max-width:850px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .search-row{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .dashboard{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .card{
        padding:12px 8px;
    }

    .number{
        font-size:23px;
    }

    header h1{
        font-size:21px;
    }

    .panel{
        padding:13px;
    }

    .tracking{
        min-width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>সনদ আবেদন কেন্দ্র</h1>
    <p>অনলাইন আবেদন ও ব্যবস্থাপনা — ০৩ নং পাঁচলাইশ ওয়ার্ড</p>
</header>

<div class="container">

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card">
            <h3>মোট আবেদন</h3>
            <div class="number" id="totalCount">০</div>
        </div>

        <div class="card">
            <h3>অপেক্ষমাণ</h3>
            <div class="number" id="pendingCount">০</div>
        </div>

        <div class="card">
            <h3>যাচাইাধীন</h3>
            <div class="number" id="verifyingCount">০</div>
        </div>

        <div class="card">
            <h3>অনুমোদিত</h3>
            <div class="number" id="approvedCount">০</div>
        </div>

    </div>


    <!-- NEW APPLICATION -->
    <div class="panel">

        <h2>নতুন আবেদন</h2>

        <!-- TRACKING NUMBER LEFT -->
        <div class="tracking-box">

            <div class="tracking">

                <div class="tracking-label">
                    আবেদন ট্র্যাকিং নং
                </div>

                <div class="tracking-number"
                     id="trackingNumber">
                    নতুন আবেদন
                </div>

            </div>

        </div>


        <div class="form-grid">

            <div class="form-group">
                <label>সনদের ধরন *</label>

                <select id="certificateType"
                        onchange="changeCertificateType()">

                    <option value="">
                        সনদের ধরন নির্বাচন করুন
                    </option>

                    <option value="death">
                        মৃত্যু সনদ প্রত্যয়ন
                    </option>

                    <option value="character">
                        চারিত্রিক সনদ
                    </option>

                    <option value="remarriage">
                        পুনঃবিবাহ না হওয়ার সনদ
                    </option>

                    <option value="citizenship">
                        নাগরিকত্ব সনদ
                    </option>

                    <option value="heir">
                        ওয়ারিশ সনদ
                    </option>

                    <option value="inheritance">
                        উত্তরাধিকার সনদ
                    </option>

                    <option value="family">
                        পারিবারিক সনদ
                    </option>

                    <option value="nationality">
                        জাতীয়তা সনদ
                    </option>

                    <option value="other">
                        অন্যান্য সনদ
                    </option>

                </select>
            </div>


            <div class="form-group">

                <label>আবেদনকারীর নাম *</label>

                <input id="applicantName"
                       placeholder="আবেদনকারীর পূর্ণ নাম">

            </div>


            <div class="form-group">

                <label>পিতার নাম</label>

                <input id="fatherName"
                       placeholder="পিতার নাম">

            </div>


            <div class="form-group">

                <label>মাতার নাম</label>

                <input id="motherName"
                       placeholder="মাতার নাম">

            </div>


            <div class="form-group">

                <label>মোবাইল নম্বর *</label>

                <input id="mobile"
                       placeholder="০১XXXXXXXXX">

            </div>


            <div class="form-group">

                <label>NID / জন্ম নিবন্ধন নম্বর</label>

                <input id="nid"
                       placeholder="NID অথবা জন্ম নিবন্ধন নম্বর">

            </div>


            <div class="form-group">

                <label>গ্রাম / মহল্লা</label>

                <input id="village"
                       placeholder="গ্রাম / মহল্লা">

            </div>


            <div class="form-group">

                <label>ডাকঘর</label>

                <input id="post"
                       placeholder="ডাকঘর">

            </div>


            <div class="form-group">

                <label>ওয়ার্ড</label>

                <input id="ward"
                       value="০৩ নং পাঁচলাইশ ওয়ার্ড">

            </div>


            <div class="form-group">

                <label>থানা</label>

                <input id="thana"
                       value="বায়েজিদ বোস্তামী">

            </div>


            <div class="form-group">

                <label>জেলা</label>

                <input id="district"
                       value="চট্টগ্রাম">

            </div>


            <div class="form-group">

                <label>আবেদনের উদ্দেশ্য</label>

                <input id="purpose"
                       placeholder="সনদটি যে কাজে প্রয়োজন">

            </div>

        </div>


        <div id="dynamicFields"></div>


        <div class="button-row">

            <button class="btn-primary"
                    onclick="submitApplication()">
                আবেদন সংরক্ষণ করুন
            </button>

            <button class="btn-secondary"
                    onclick="resetForm()">
                ফর্ম পরিষ্কার
            </button>

        </div>

    </div>


    <!-- APPLICATION MANAGEMENT -->
    <div class="panel">

        <h2>আবেদন ব্যবস্থাপনা</h2>

        <div class="search-row">

            <input id="searchInput"
                   placeholder="ট্র্যাকিং নং / নাম / মোবাইল দিয়ে খুঁজুন"
                   oninput="renderApplications()">

            <select id="statusFilter"
                    onchange="renderApplications()">

                <option value="">
                    সব স্ট্যাটাস
                </option>

                <option value="অপেক্ষমাণ">
                    অপেক্ষমাণ
                </option>

                <option value="যাচাইাধীন">
                    যাচাইাধীন
                </option>

                <option value="অনুমোদিত">
                    অনুমোদিত
                </option>

                <option value="বাতিল">
                    বাতিল
                </option>

            </select>


            <select id="typeFilter"
                    onchange="renderApplications()">

                <option value="">
                    সব ধরনের আবেদন
                </option>

                <option value="death">
                    মৃত্যু
                </option>

                <option value="character">
                    চারিত্রিক
                </option>

                <option value="remarriage">
                    পুনঃবিবাহ না হওয়ার
                </option>

                <option value="citizenship">
                    নাগরিকত্ব
                </option>

                <option value="heir">
                    ওয়ারিশ
                </option>

                <option value="inheritance">
                    উত্তরাধিকার
                </option>

                <option value="family">
                    পারিবারিক
                </option>

                <option value="nationality">
                    জাতীয়তা
                </option>

                <option value="other">
                    অন্যান্য
                </option>

            </select>


            <button class="btn-info"
                    onclick="renderApplications()">
                অনুসন্ধান
            </button>

        </div>


        <div id="applicationsList"></div>

    </div>

</div>


<div class="watermark">
    আলী ইসলাম, উদ্যোক্তা, ০৩ নং পাঁচলাইশ ওয়ার্ড
</div>


<!-- DETAILS MODAL -->
<div class="modal" id="detailsModal">

    <div class="modal-content">

        <span class="close"
              onclick="closeModal()">
            &times;
        </span>

        <h2>আবেদনের বিস্তারিত তথ্য</h2>

        <div id="detailsContent"></div>

    </div>

</div>


<!-- PRINT -->
<div id="printArea"></div>


<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
    "certificateApplications";

let applications =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );


/* =========================
   CERTIFICATE NAMES
========================= */

const certificateNames = {

    death:"মৃত্যু সনদ প্রত্যয়ন",
    character:"চারিত্রিক সনদ",
    remarriage:"পুনঃবিবাহ না হওয়ার সনদ",
    citizenship:"নাগরিকত্ব সনদ",
    heir:"ওয়ারিশ সনদ",
    inheritance:"উত্তরাধিকার সনদ",
    family:"পারিবারিক সনদ",
    nationality:"জাতীয়তা সনদ",
    other:"অন্যান্য সনদ"

};


/* =========================
   BANGLA NUMBER
========================= */

function bnNumber(value){

    const en =
        "0123456789";

    const bn =
        "০১২৩৪৫৬৭৮৯";

    return String(value).replace(
        /[0-9]/g,
        d => bn[en.indexOf(d)]
    );
}


/* =========================
   APPLICATION NUMBER
========================= */

function generateApplicationNumber(){

    const year =
        new Date().getFullYear();

    let max = 0;

    applications.forEach(app=>{

        const match =
            String(app.applicationNo || "")
            .match(/-(\d+)$/);

        if(match){

            const n =
                parseInt(match[1]);

            if(n > max){
                max = n;
            }

        }

    });

    return "CER-" +
        year +
        "-" +
        String(max + 1).padStart(4,"0");
}


/* =========================
   CERTIFICATE ID
========================= */

function generateCertificateId(){

    return "CERT-" +
        Date.now()
        .toString(36)
        .toUpperCase();

}


/* =========================
   PREVIEW TRACKING
========================= */

function updateTrackingPreview(){

    const number =
        generateApplicationNumber();

    document.getElementById(
        "trackingNumber"
    ).textContent = number;

}


/* =========================
   CHANGE TYPE
========================= */

function changeCertificateType(){

    const type =
        document.getElementById(
            "certificateType"
        ).value;

    const box =
        document.getElementById(
            "dynamicFields"
        );

    box.innerHTML = "";

    updateTrackingPreview();

    if(!type) return;


    /* DEATH */

    if(type === "death"){

        box.innerHTML = `

        <div class="dynamic-box">

            <div class="dynamic-header">
                <h3>মৃত ব্যক্তির তথ্য</h3>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>মৃত ব্যক্তির নাম</label>
                    <input id="deceasedName">
                </div>

                <div class="form-group">
                    <label>সম্পর্ক</label>
                    <input id="deceasedRelation">
                </div>

                <div class="form-group">
                    <label>পিতার নাম</label>
                    <input id="deceasedFather">
                </div>

                <div class="form-group">
                    <label>মাতার নাম</label>
                    <input id="deceasedMother">
                </div>

                <div class="form-group">
                    <label>মৃত্যুর তারিখ</label>
                    <input type="date" id="deathDate">
                </div>

                <div class="form-group">
                    <label>মৃত্যুর স্থান</label>
                    <input id="deathPlace">

/* =========================
   SERIAL
========================= */

function updateSerial(bodyId){

    const tbody =
        document.getElementById(bodyId);

    if(!tbody) return;

    [...tbody.querySelectorAll("tr")]
    .forEach((tr,index)=>{

        const cell =
            tr.querySelector(".serial");

        if(cell){

            cell.textContent =
                bnNumber(index + 1);

        }

    });

}

    const tbody =
        document.getElementById(
            "familyTableBody"
        );

    const count =
        document.getElementById(
            "memberCount"
        );

    if(!tbody || !count) return;

    count.value =
        bnNumber(
            tbody.querySelectorAll("tr").length
        );

}


/* =========================
   COLLECT DYNAMIC DATA
========================= */

function collectDynamicData(){

    const type =
        val("certificateType");

    const data = {};


    if(type === "death"){

        data.deceasedName =
            val("deceasedName");

        data.deceasedRelation =
            val("deceasedRelation");

        data.deceasedFather =
            val("deceasedFather");

        data.deceasedMother =
            val("deceasedMother");

        data.deathDate =
            val("deathDate");

        data.deathPlace =
            val("deathPlace");

        data.deathCause =
            val("deathCause");

    }


    if(type === "character"){

        data.profession =
            val("profession");

        data.currentAddress =
            val("currentAddress");

        data.characterDetails =
            val("characterDetails");

    }


    if(type === "remarriage"){

        data.maritalStatus =
            val("maritalStatus");

        data.formerSpouse =
            val("formerSpouse");

        data.marriageEndDate =
            val("marriageEndDate");

        data.remarriageDetails =
            val("remarriageDetails");

    }


    if(type === "citizenship"){

        data.profession =
            val("profession");

        data.birthPlace =
            val("birthPlace");

        data.birthDate =
            val("birthDate");

        data.permanentAddress =
            val("permanentAddress");

    }


    if(type === "nationality"){

        data.nationality =
            val("nationality");

        data.birthPlace =
            val("birthPlace");

        data.birthDate =
            val("birthDate");

        data.profession =
            val("profession");

    }


    if(type === "other"){

        data.otherCertificateName =
            val("otherCertificateName");

        data.otherDetails =
            val("otherDetails");

    }


    if(type === "heir"){

        data.deceasedName =
            val("deceasedName");

        data.deceasedFather =
            val("deceasedFather");

        data.deceasedMother =
            val("deceasedMother");

        data.deathDate =
            val("deathDate");


        data.heirs = [];


        document
        .querySelectorAll(
            "#heirTableBody tr"
        )
        .forEach(tr=>{

            data.heirs.push({

                name:
                    tr.querySelector(
                        ".hr-name"
                    )?.value || "",

                relation:
                    tr.querySelector(
                        ".hr-relation"
                    )?.value || "",

                father:
                    tr.querySelector(
                        ".hr-father"
                    )?.value || "",

                nid:
                    tr.querySelector(
                        ".hr-nid"
                    )?.value || "",

                dob:
                    tr.querySelector(
                        ".hr-dob"
                    )?.value || "",

                age:
                    tr.querySelector(
                        ".hr-age"
                    )?.value || ""

            });

        });

    }


    if(type === "inheritance"){

        data.deceasedName =
            val("deceasedName");

        data.deceasedFather =
            val("deceasedFather");

        data.deceasedMother =
            val("deceasedMother");

        data.deathDate =
            val("deathDate");


        data.inheritance = [];


        document
        .querySelectorAll(
            "#inheritanceTableBody tr"
        )
        .forEach(tr=>{

            data.inheritance.push({

                name:
                    tr.querySelector(
                        ".in-name"
                    )?.value || "",

                relation:
                    tr.querySelector(
                        ".in-relation"
                    )?.value || "",

                father:
                    tr.querySelector(
                        ".in-father"
                    )?.value || "",

                nid:
                    tr.querySelector(
                        ".in-nid"
                    )?.value || "",

                dob:
                    tr.querySelector(
                        ".in-dob"
                    )?.value || "",

                age:
                    tr.querySelector(
                        ".in-age"
                    )?.value || ""

            });

        });

    }


    if(type === "family"){

        data.familyHead =
            val("familyHead");

        data.memberCount =
            document.querySelectorAll(
                "#familyTableBody tr"
            ).length;


        data.members = [];


        document
        .querySelectorAll(
            "#familyTableBody tr"
        )
        .forEach(tr=>{

            data.members.push({

                name:
                    tr.querySelector(
                        ".fm-name"
                    )?.value || "",

                relation:
                    tr.querySelector(
                        ".fm-relation"
                    )?.value || "",

                father:
                    tr.querySelector(
                        ".fm-father"
                    )?.value || "",

                nid:
                    tr.querySelector(
                        ".fm-nid"
                    )?.value || "",

                dob:
                    tr.querySelector(
                        ".fm-dob"
                    )?.value || "",

                age:
                    tr.querySelector(
                        ".fm-age"
                    )?.value || ""

            });

        });

    }


    return data;

}

/* =========================
   SUBMIT
========================= */

function submitApplication(){

    const type =
        val("certificateType");

    const name =
        val("applicantName");

    const mobile =
        val("mobile");


    if(!type){

        alert(
            "সনদের ধরন নির্বাচন করুন।"
        );

        return;
    }


    if(!name){

        alert(
            "আবেদনকারীর নাম লিখুন।"
        );

        return;
    }


    if(!mobile){

        alert(
            "মোবাইল নম্বর লিখুন।"
        );

        return;
    }


    const applicationNo =
        generateApplicationNumber();


    const application = {

        id:
            Date.now(),

        applicationNo:
            applicationNo,

        certificateId:
            "",

        certificateType:
            type,

        applicantName:
            name,

        fatherName:
            val("fatherName"),

        motherName:
            val("motherName"),

        mobile:
            mobile,

        nid:
            val("nid"),

        village:
            val("village"),

        post:
            val("post"),

        ward:
            val("ward"),

        thana:
            val("thana"),

        district:
            val("district"),

        purpose:
            val("purpose"),

        dynamic:
            collectDynamicData(),

        status:
            "অপেক্ষমাণ",

        applicationDate:
            new Date().toISOString(),

        issueDate:
            ""

    };


    applications.push(application);

    saveApplications();


    alert(
        "আবেদন সফলভাবে সংরক্ষণ হয়েছে।\n\n" +
        "আবেদন ট্র্যাকিং নং: " +
        applicationNo
    );


    resetForm();

    renderApplications();

    updateDashboard();

}

/* =========================
   STATUS CLASS
========================= */

function statusClass(status){

    if(status==="অপেক্ষমাণ")
        return "status-pending";

    if(status==="যাচাইাধীন")
        return "status-verifying";

    if(status==="অনুমোদিত")
        return "status-approved";

    return "status-cancelled";

}

function renderApplications(){

    const container =
        document.getElementById(
            "applicationsList"
        );


    const search =
        val("searchInput")
        .toLowerCase();


    const status =
        val("statusFilter");


    const type =
        val("typeFilter");


    let list =
        applications.filter(app=>{

            const text =
                (
                    app.applicationNo +
                    " " +
                    app.applicantName +
                    " " +
                    app.mobile
                ).toLowerCase();


            return
                (!search ||
                 text.includes(search)) &&

                (!status ||
                 app.status === status) &&

                (!type ||
                 app.certificateType === type);

        });


    if(!list.length){

        container.innerHTML = `
            <div class="empty">
                কোনো আবেদন পাওয়া যায়নি।
            </div>
        `;

        return;
    }


    list.sort(
        (a,b)=>
            new Date(b.applicationDate) -
            new Date(a.applicationDate)
    );


    container.innerHTML =
        list.map(app=>`

        <div class="application-card">

            <div class="application-top">

                <div>

                    <div class="application-number">
                        ${escapeHTML(
                            app.applicationNo
                        )}
                    </div>

                    <div>
                        ${escapeHTML(
                            app.applicantName
                        )}
                    </div>

                </div>

                <span class="status ${statusClass(app.status)}">
                    ${app.status}
                </span>

            </div>


            <div style="margin-top:8px;font-size:13px">

                মোবাইল:
                ${escapeHTML(app.mobile)}

                &nbsp; | &nbsp;

                আবেদন:
                ${formatDateTime(
                    app.applicationDate
                )}

            </div>


            <div class="application-actions">

                <button class="btn-info"
                        onclick="viewApplication(${app.id})">
                    বিস্তারিত
                </button>

                <button class="btn-warning"
                        onclick="changeStatus(${app.id})">
                    স্ট্যাটাস পরিবর্তন
                </button>

                ${
                    app.status === "অনুমোদিত"
                    ?
                    `
                    <button class="btn-success"
                            onclick="generateCertificate(${app.id})">
                        সনদ তৈরি
                    </button>
                    `
                    :
                    ""
                }

                ${
                    app.certificateId
                    ?
                    `
                    <button class="btn-primary"
                            onclick="printCertificate(${app.id})">
                        সনদ প্রিন্ট
                    </button>
                    `
                    :
                    ""
                }

                <button class="btn-danger"
                        onclick="deleteApplication(${app.id})">
                    মুছুন
                </button>

            </div>

        </div>

        `).join("");

}

/* =========================
   STATUS CHANGE
========================= */

function changeStatus(id){

    const app =
        applications.find(
            a=>a.id===id
        );

    if(!app) return;


    const newStatus =
        prompt(
            "নতুন স্ট্যাটাস লিখুন:\n\n" +
            "অপেক্ষমাণ\n" +
            "যাচাইাধীন\n" +
            "অনুমোদিত\n" +
            "বাতিল",
            app.status
        );


    if(!newStatus) return;


    const valid = [

        "অপেক্ষমাণ",
        "যাচাইাধীন",
        "অনুমোদিত",
        "বাতিল"

    ];


    if(!valid.includes(newStatus)){

        alert(
            "সঠিক স্ট্যাটাস লিখুন।"
        );

        return;
    }


    app.status =
        newStatus;


    if(newStatus === "অনুমোদিত"){

        if(!app.certificateId){

            app.certificateId =
                generateCertificateId();

        }

        app.issueDate =
            new Date().toISOString();

    }


    saveApplications();

    renderApplications();

    updateDashboard();

}


/* =========================
   DELETE
========================= */

function deleteApplication(id){

    const app =
        applications.find(
            a=>a.id===id
        );

    if(!app) return;


    if(!confirm(
        "এই আবেদনটি মুছে ফেলতে চান?\n\n" +
        app.applicationNo
    )){

        return;
    }


    applications =
        applications.filter(
            a=>a.id!==id
        );


    saveApplications();

    renderApplications();

    updateDashboard();

}


/* =========================
   GENERATE CERTIFICATE
========================= */

function generateCertificate(id){

    const app =
        applications.find(
            a=>a.id===id
        );

    if(!app) return;


    if(app.status !== "অনুমোদিত"){

        alert(
            "শুধুমাত্র অনুমোদিত আবেদন থেকে সনদ তৈরি করা যাবে।"
        );

        return;
    }


    if(!app.certificateId){

        app.certificateId =
            generateCertificateId();

    }


    if(!app.issueDate){

        app.issueDate =
            new Date().toISOString();

    }


    saveApplications();

    printCertificate(id);

}


/* =========================
   PRINT CERTIFICATE
========================= */

function printCertificate(id){

    const app =
        applications.find(
            a=>a.id===id
        );

    if(!app) return;


    if(!app.certificateId){

        app.certificateId =
            generateCertificateId();

        app.issueDate =
            new Date().toISOString();

        saveApplications();

    }


    document.getElementById(
        "printArea"
    ).innerHTML =
        buildCertificateHTML(app);


    setTimeout(()=>{

        window.print();

    },300);

}
