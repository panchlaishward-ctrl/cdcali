<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - ০৩ নং পাঁচলাইশ ওয়ার্ড</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Bengali","Segoe UI",Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* =========================
   LOGIN
========================= */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.login-logo{
    width:70px;
    height:70px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#1d4ed8;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
}

.login-box h1{
    text-align:center;
    margin:0 0 8px;
    font-size:24px;
}

.login-subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.form-group input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.login-btn{
    width:100%;
    border:none;
    padding:14px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    border-radius:9px;
    cursor:pointer;
}

.login-btn:hover{
    background:#1d4ed8;
}

.login-error{
    display:none;
    background:#fee2e2;
    color:#b91c1c;
    padding:11px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
}

/* =========================
   ADMIN PANEL
========================= */

#adminPanel{
    display:none;
}

.header{
    background:#0f172a;
    color:#fff;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header-title h1{
    margin:0;
    font-size:22px;
}

.header-title p{
    margin:4px 0 0;
    color:#cbd5e1;
}

.logout-btn{
    border:none;
    background:#dc2626;
    color:#fff;
    padding:10px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

/* Dashboard */

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat-card h3{
    margin:0 0 8px;
    font-size:15px;
    color:#64748b;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
}

/* Toolbar */

.toolbar{
    background:#fff;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.toolbar input,
.toolbar select{
    padding:11px 12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
}

.toolbar input{
    flex:1;
    min-width:220px;
}

/* Table */

.table-box{
    background:#fff;
    border-radius:12px;
    overflow:auto;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #e2e8f0;
    text-align:left;
}

th{
    background:#f8fafc;
    font-weight:bold;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.status-pending{
    background:#fef3c7;
    color:#92400e;
}

.status-processing{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-completed{
    background:#dcfce7;
    color:#166534;
}

.status-rejected{
    background:#fee2e2;
    color:#991b1b;
}

.action-btn{
    border:none;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
    margin:2px;
}

.view-btn{
    background:#2563eb;
    color:#fff;
}

.edit-btn{
    background:#f59e0b;
    color:#fff;
}

.delete-btn{
    background:#dc2626;
    color:#fff;
}

.print-btn{
    background:#16a34a;
    color:#fff;
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal-content{
    max-width:900px;
    margin:30px auto;
    background:#fff;
    border-radius:15px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e2e8f0;
    padding-bottom:15px;
    margin-bottom:20px;
}

.close-btn{
    border:none;
    background:#ef4444;
    color:#fff;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.info-item{
    background:#f8fafc;
    padding:12px;
    border-radius:8px;
}

.info-item strong{
    display:block;
    margin-bottom:5px;
    color:#475569;
}

.members-table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

.members-table th,
.members-table td{
    border:1px solid #cbd5e1;
}

/* Responsive */

@media(max-width:800px){

    .dashboard{
        grid-template-columns:repeat(2,1fr);
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }
}

@media(max-width:500px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    .login-box{
        padding:25px 20px;
    }
}

/* Print */

@media print{

    body{
        background:#fff;
    }

    .header,
    .dashboard,
    .toolbar,
    .table-box,
    .modal-header,
    .no-print{
        display:none !important;
    }

    .modal{
        position:static;
        background:none;
        display:block !important;
        padding:0;
    }

    .modal-content{
        box-shadow:none;
        max-width:none;
        margin:0;
        padding:0;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="login-logo">
            ভোট
        </div>

        <h1>Admin Panel</h1>

        <div class="login-subtitle">
            ০৩ নং পাঁচলাইশ ওয়ার্ড
        </div>

        <div id="loginError" class="login-error">
            User ID অথবা Password ভুল হয়েছে।
        </div>

        <div class="form-group">
            <label>User ID</label>
            <input
                type="text"
                id="username"
                placeholder="User ID লিখুন"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Password লিখুন"
                autocomplete="current-password"
            >
        </div>

        <button class="login-btn" onclick="login()">
            Login
        </button>

    </div>

</div>


<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">

    <div class="header">

        <div class="header-title">
            <h1>Admin Panel</h1>
            <p>০৩ নং পাঁচলাইশ ওয়ার্ড — আবেদন ব্যবস্থাপনা</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>


    <div class="container">

        <!-- Dashboard -->

        <div class="dashboard">

            <div class="stat-card">
                <h3>মোট আবেদন</h3>
                <div class="stat-number" id="totalApplications">0</div>
            </div>

            <div class="stat-card">
                <h3>অপেক্ষমাণ</h3>
                <div class="stat-number" id="pendingApplications">0</div>
            </div>

            <div class="stat-card">
                <h3>প্রক্রিয়াধীন</h3>
                <div class="stat-number" id="processingApplications">0</div>
            </div>

            <div class="stat-card">
                <h3>সম্পন্ন</h3>
                <div class="stat-number" id="completedApplications">0</div>
            </div>

        </div>


        <!-- Search -->

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="ট্র্যাকিং নম্বর / নাম / মোবাইল দিয়ে খুঁজুন..."
                oninput="filterApplications()"
            >

            <select
                id="statusFilter"
                onchange="filterApplications()"
            >
                <option value="">সকল Status</option>
                <option value="pending">অপেক্ষমাণ</option>
                <option value="processing">প্রক্রিয়াধীন</option>
                <option value="completed">সম্পন্ন</option>
                <option value="rejected">বাতিল</option>
            </select>

            <select
                id="certificateFilter"
                onchange="filterApplications()"
            >
                <option value="">সকল সনদ</option>
                <option value="warish">ওয়ারিশ সনদ</option>
                <option value="inheritance">উত্তরাধিকার সনদ</option>
                <option value="family">পারিবারিক সনদ</option>
                <option value="death">মৃত্যু সনদ</option>
                <option value="character">চারিত্রিক সনদ</option>
                <option value="citizenship">নাগরিকত্ব সনদ</option>
                <option value="nationality">জাতীয়তা সনদ</option>
                <option value="remarriage">পুনঃবিবাহ না হওয়ার সনদ</option>
            </select>

        </div>


        <!-- Applications Table -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>
                        <th>ট্র্যাকিং নং</th>
                        <th>সনদের ধরন</th>
                        <th>আবেদনকারীর নাম</th>
                        <th>মোবাইল</th>
                        <th>আবেদনের তারিখ</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="applicationTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================
     DETAILS MODAL
========================= -->

<div id="detailsModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>আবেদনের বিস্তারিত তথ্য</h2>

            <button
                class="close-btn no-print"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div id="detailsContent"></div>

        <div class="no-print" style="margin-top:20px;">

            <button
                class="action-btn print-btn"
                onclick="window.print()"
            >
                🖨 Print / PDF
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   LOGIN INFORMATION
===================================================== */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "Panchlaish@2026";


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        localStorage.setItem(
            "panchlaish_admin_login",
            "true"
        );

        error.style.display = "none";

        showAdminPanel();

    }else{

        error.style.display = "block";

    }

}


/* Enter key */

document.getElementById("password")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        login();
    }

});


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "panchlaish_admin_login"
    );

    location.reload();

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdminPanel(){

    document.getElementById("loginPage")
        .style.display = "none";

    document.getElementById("adminPanel")
        .style.display = "block";

    loadApplications();

}


/* =====================================================
   CHECK LOGIN
===================================================== */

if(
    localStorage.getItem(
        "panchlaish_admin_login"
    ) === "true"
){

    showAdminPanel();

}


/* =====================================================
   APPLICATION DATA
===================================================== */

let applications = [];


/* =====================================================
   LOAD APPLICATIONS
===================================================== */

function loadApplications(){

    try{

        applications =
            JSON.parse(
                localStorage.getItem(
                    "panchlaish_applications"
                )
            ) || [];

    }catch(error){

        applications = [];

    }

    renderApplications();
    updateDashboard();

}


/* =====================================================
   CERTIFICATE NAME
===================================================== */

function getCertificateName(type){

    const names = {

        warish:"ওয়ারিশ সনদ",

        inheritance:"উত্তরাধিকার সনদ",

        family:"পারিবারিক সনদ",

        death:"মৃত্যু সনদ",

        character:"চারিত্রিক সনদ",

        citizenship:"নাগরিকত্ব সনদ",

        nationality:"জাতীয়তা সনদ",

        remarriage:"পুনঃবিবাহ না হওয়ার সনদ"

    };

    return names[type] || type || "";

}


/* =====================================================
   STATUS
===================================================== */

function getStatusText(status){

    const names = {

        pending:"অপেক্ষমাণ",

        processing:"প্রক্রিয়াধীন",

        completed:"সম্পন্ন",

        rejected:"বাতিল"

    };

    return names[status] || "অপেক্ষমাণ";

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    if(status === "processing")
        return "status-processing";

    if(status === "completed")
        return "status-completed";

    if(status === "rejected")
        return "status-rejected";

    return "status-pending";

}


/* =====================================================
   RENDER APPLICATIONS
===================================================== */

function renderApplications(data = applications){

    const tbody =
        document.getElementById(
            "applicationTableBody"
        );

    tbody.innerHTML = "";


    if(data.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;padding:30px;">
                    কোনো আবেদন পাওয়া যায়নি।
                </td>
            </tr>
        `;

        return;

    }


    data.forEach(app => {

        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                <strong>
                    ${escapeHTML(app.tracking || "")}
                </strong>
            </td>

            <td>
                ${escapeHTML(
                    getCertificateName(
                        app.certificate
                    )
                )}
            </td>

            <td>
                ${escapeHTML(
                    app.applicantName || ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    app.applicantMobile || ""
                )}
            </td>

            <td>
                ${escapeHTML(
                    app.createdAt || ""
                )}
            </td>

            <td>

                <span class="status ${getStatusClass(app.status)}">

                    ${getStatusText(app.status)}

                </span>

            </td>

            <td>

                <button
                    class="action-btn view-btn"
                    onclick="viewApplication('${app.tracking}')"
                >
                    দেখুন
                </button>

                <button
                    class="action-btn edit-btn"
                    onclick="changeStatus('${app.tracking}')"
                >
                    Status
                </button>

                <button
                    class="action-btn delete-btn"
                    onclick="deleteApplication('${app.tracking}')"
                >
                    Delete
                </button>

            </td>

        `;

        tbody.appendChild(tr);

    });

}


/* =====================================================
   SEARCH / FILTER
===================================================== */

function filterApplications(){

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const certificate =
        document.getElementById(
            "certificateFilter"
        ).value;


    const filtered =
        applications.filter(app => {

            const text = (

                (app.tracking || "") +
                " " +
                (app.applicantName || "") +
                " " +
                (app.applicantMobile || "")

            ).toLowerCase();


            const matchSearch =
                !search ||
                text.includes(search);


            const matchStatus =
                !status ||
                app.status === status;


            const matchCertificate =
                !certificate ||
                app.certificate === certificate;


            return(
                matchSearch &&
                matchStatus &&
                matchCertificate
            );

        });


    renderApplications(filtered);

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

    document.getElementById(
        "totalApplications"
    ).textContent =
        applications.length;


    document.getElementById(
        "pendingApplications"
    ).textContent =
        applications.filter(
            x => x.status === "pending"
        ).length;


    document.getElementById(
        "processingApplications"
    ).textContent =
        applications.filter(
            x => x.status === "processing"
        ).length;


    document.getElementById(
        "completedApplications"
    ).textContent =
        applications.filter(
            x => x.status === "completed"
        ).length;

}


/* =====================================================
   VIEW APPLICATION
===================================================== */

function viewApplication(tracking){

    const app =
        applications.find(
            x => x.tracking === tracking
        );


    if(!app) return;


    let membersHTML = "";


    if(
        Array.isArray(app.members) &&
        app.members.length > 0
    ){

        membersHTML = `

            <h3 style="margin-top:25px;">
                সদস্যদের তথ্য
            </h3>

            <table class="members-table">

                <thead>

                    <tr>

                        <th>ক্রমিক নং</th>
                        <th>নাম</th>
                        <th>জন্ম তারিখ</th>
                        <th>বয়স</th>
                        <th>সম্পর্ক</th>
                        <th>মন্তব্য</th>

                    </tr>

                </thead>

                <tbody>

                    ${app.members.map(
                        (member,index) => `

                        <tr>

                            <td>${index + 1}</td>

                            <td>
                                ${escapeHTML(
                                    member.name || ""
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    member.birthDate || ""
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    member.age || ""
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    member.relation || ""
                                )}
                            </td>

                            <td>
                                ${escapeHTML(
                                    member.comment || ""
                                )}
                            </td>

                        </tr>

                    `).join("")}

                </tbody>

            </table>

        `;

    }


    document.getElementById(
        "detailsContent"
    ).innerHTML = `

        <div style="text-align:center;margin-bottom:20px;">

            <h2>
                চট্টগ্রাম সিটি কর্পোরেশন
            </h2>

            <p>
                ০৩ নং পাঁচলাইশ ওয়ার্ড
            </p>

        </div>

        <div class="info-grid">

            <div class="info-item">
                <strong>ট্র্যাকিং নং</strong>
                ${escapeHTML(app.tracking || "")}
            </div>

            <div class="info-item">
                <strong>সনদের ধরন</strong>
                ${escapeHTML(
                    getCertificateName(
                        app.certificate
                    )
                )}
            </div>

            <div class="info-item">
                <strong>আবেদনকারীর নাম</strong>
                ${escapeHTML(
                    app.applicantName || ""
                )}
            </div>

            <div class="info-item">
                <strong>পিতা/স্বামীর নাম</strong>
                ${escapeHTML(
                    app.applicantFather || ""
                )}
            </div>

            <div class="info-item">
                <strong>মাতার নাম</strong>
                ${escapeHTML(
                    app.applicantMother || ""
                )}
            </div>

            <div class="info-item">
                <strong>সম্পর্ক</strong>
                ${escapeHTML(
                    app.applicantRelation || ""
                )}
            </div>

            <div class="info-item">
                <strong>মোবাইল</strong>
                ${escapeHTML(
                    app.applicantMobile || ""
                )}
            </div>

            <div class="info-item">
                <strong>বর্তমান ঠিকানা</strong>
                ${escapeHTML(
                    app.presentAddress || ""
                )}
            </div>

            <div class="info-item">
                <strong>স্থায়ী ঠিকানা</strong>
                ${escapeHTML(
                    app.permanentAddress || ""
                )}
            </div>

            <div class="info-item">
                <strong>আবেদনের তারিখ</strong>
                ${escapeHTML(
                    app.createdAt || ""
                )}
            </div>

            <div class="info-item">
                <strong>Status</strong>

                <span class="status ${getStatusClass(app.status)}">
                    ${getStatusText(app.status)}
                </span>

            </div>

        </div>

        ${membersHTML}

    `;


    document.getElementById(
        "detailsModal"
    ).style.display = "block";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "detailsModal"
    ).style.display = "none";

}


/* =====================================================
   CHANGE STATUS
===================================================== */

function changeStatus(tracking){

    const app =
        applications.find(
            x => x.tracking === tracking
        );


    if(!app) return;


    const newStatus =
        prompt(
            "Status নির্বাচন করুন:\n\n" +
            "pending = অপেক্ষমাণ\n" +
            "processing = প্রক্রিয়াধীন\n" +
            "completed = সম্পন্ন\n" +
            "rejected = বাতিল",
            app.status || "pending"
        );


    if(
        !newStatus ||
        ![
            "pending",
            "processing",
            "completed",
            "rejected"
        ].includes(newStatus)
    ){

        return;

    }


    app.status = newStatus;


    localStorage.setItem(
        "panchlaish_applications",
        JSON.stringify(applications)
    );


    renderApplications();
    updateDashboard();

}


/* =====================================================
   DELETE
===================================================== */

function deleteApplication(tracking){

    const app =
        applications.find(
            x => x.tracking === tracking
        );


    if(!app) return;


    const confirmDelete =
        confirm(
            "আপনি কি এই আবেদনটি Delete করতে চান?\n\n" +
            "Tracking: " + tracking
        );


    if(!confirmDelete) return;


    applications =
        applications.filter(
            x => x.tracking !== tracking
        );


    localStorage.setItem(
        "panchlaish_applications",
        JSON.stringify(applications)
    );


    renderApplications();
    updateDashboard();

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CLOSE MODAL OUTSIDE
===================================================== */

window.addEventListener(
    "click",
    function(e){

        const modal =
            document.getElementById(
                "detailsModal"
            );

        if(e.target === modal){
            closeModal();
        }

    }
);

</script>
